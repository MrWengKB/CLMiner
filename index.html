<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>挖矿小能手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部：标题 + 状态 + 按钮 -->
    <header class="topbar">
      <h1 class="title">⛏️ 挖矿小能手</h1>
      <div class="stats">
        <div class="stat" title="生命值">❤️ <span id="hearts">6</span></div>
        <div class="stat" title="矿铲">⛏️ <span id="shovels">10</span></div>
        <div class="stat" title="金币">🪙 <span id="coins">0</span></div>
        <div class="stat" title="深度">⬇️ <span id="depth">1</span>/30</div>
      </div>
      <div class="toolbar">
        <button class="btn" id="btn-load">📂 加载题库</button>
        <button class="btn" id="btn-shop">🛒 小商店</button>
        <button class="btn btn-danger" id="btn-exit">🚪 退出游戏</button>
        <input type="file" id="file-input" accept=".csv,text/csv" hidden />
      </div>
    </header>

    <!-- 矿山 -->
    <main class="mine">
      <div class="surface"></div>
      <div class="viewport" id="viewport">
        <div class="grid" id="grid">
          <div class="player" id="player"><span>👷</span></div>
        </div>
      </div>
    </main>

    <!-- 触屏方向键 -->
    <nav class="dpad">
      <button class="dir" id="btn-up" data-dir="up" aria-label="上">▲</button>
      <button class="dir" id="btn-left" data-dir="left" aria-label="左">◀</button>
      <button class="dir" id="btn-down" data-dir="down" aria-label="下">▼</button>
      <button class="dir" id="btn-right" data-dir="right" aria-label="右">▶</button>
    </nav>
    <p class="hint">键盘：WASD / 方向键 · 黄矿需挖两次 · 小心炸弹 💣！</p>
  </div>

  <!-- 弹窗 -->
  <div class="modal hidden" id="modal">
    <div class="modal-box" id="modal-box"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
